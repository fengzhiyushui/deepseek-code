<!DOCTYPE html>
<html lang="zh-CN" theme="sumi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DeepSeek Code v1.4.0 — 主题画廊 v4(10 套,同 v3)</title>
<link rel="stylesheet" href="tokens.css" />
<style>
  body { padding: 22px; }
  .g-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 6px; }
  .g-head h1 { font-size: var(--fs-18); font-weight: 650; }
  .g-head .sub { color: var(--text-mut); font-size: var(--fs-12); }
  .g-head .links { margin-left: auto; display: flex; gap: 14px; font-size: var(--fs-12); }
  .g-head .links a { color: var(--accent); text-decoration: none; }
  .grp-t { color: var(--text-faint); font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase; margin: 20px 0 10px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 16px; }
  .tile { border: 1.5px solid var(--border-strong); border-radius: var(--r-10); overflow: hidden; cursor: pointer; transition: transform .15s ease, border-color .15s ease; }
  .tile:hover { transform: translateY(-2px); }
  .tile.on { border-color: var(--accent); }
  .tile .t-name {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; font-size: var(--fs-12);
    border-bottom: 1px solid;
  }
  .tile .t-name .kind { margin-left: auto; font-size: 10px; opacity: .75; }
  .tile .t-body { padding: 12px; }
  .tile .mock { display: flex; flex-direction: column; gap: 8px; }
  .tile .m-user {
    align-self: flex-end; max-width: 82%;
    border-radius: 12px 12px 3px 12px; padding: 7px 12px; font-size: var(--fs-12);
  }
  .tile .m-ev { border: 1px solid; border-radius: var(--r-8); overflow: hidden; }
  .tile .m-ev .h { display: flex; gap: 6px; align-items: center; padding: 5px 10px; border-bottom: 1px solid; font-size: var(--fs-11); }
  .tile .m-ev .b { padding: 7px 10px; font-size: var(--fs-11); }
  .tile .m-input { display: flex; align-items: center; gap: 8px; border: 1px solid; border-radius: 12px; padding: 7px 11px; }
  .tile .m-input .ph { flex: 1; font-size: var(--fs-12); }
  .tile .m-input .s { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; }
  .tile .palette { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin-top: 10px; }
  .tile .palette .p { height: 22px; border-radius: 4px; border: 1px solid rgba(128,128,128,.25); position: relative; }
  .tile .palette .p span { position: absolute; bottom: 1px; left: 3px; font-size: 8px; opacity: .75; }
</style>
</head>
<body>
<div class="g-head">
  <h1>主题画廊 v4</h1>
  <span class="sub">v1.4.0 设计系统 · 10 套主题(3 浅 7 深)· 第四轮配色全部取自各方案官方定义源,并已通过 WCAG 对比度校验 · 点任意卡片即把本站切到该主题</span>
  <div class="links">
    <a href="gui.html">GUI v4 →</a>
    <a href="tui.html">TUI v4 →</a>
    <a href="index.html">索引 →</a>
  </div>
</div>

<div class="grp-t">浅色 · Light(3 套)</div>
<div class="grid" id="gridLight"></div>
<div class="grp-t">深色 · Dark(7 套)</div>
<div class="grid" id="gridDark"></div>

<script>
  const THEMES = [
    { id: "paper",  name: "宣 Paper",  kind: "墨落纸上 · Flexoki Light",        dark: false },
    { id: "dawn",   name: "曦 Dawn",   kind: "暖底雾玫 · Rosé Pine Dawn",       dark: false },
    { id: "latte",  name: "瓷 Latte",  kind: "粉彩中性 · Catppuccin Latte",     dark: false },
    { id: "sumi",   name: "墨 Sumi",   kind: "浮世绘墨 · Kanagawa Wave · 默认", dark: true  },
    { id: "mocha",  name: "檀 Mocha",  kind: "柔和粉彩 · Catppuccin Mocha",     dark: true  },
    { id: "moon",   name: "霄 Moon",   kind: "夜蓝均衡 · Tokyo Night Moon",     dark: true  },
    { id: "nord",   name: "峡 Nord",   kind: "北极极简 · Nord",                 dark: true  },
    { id: "forest", name: "苔 Forest", kind: "森林低刺激 · Everforest Dark",    dark: true  },
    { id: "clay",   name: "陶 Clay",   kind: "降饱和暖调 · Gruvbox Material",   dark: true  },
    { id: "rose",   name: "黛 Rose",   kind: "暗紫玫瑰 · Rosé Pine",            dark: true  },
  ];
  const VARS = ["--bg-base","--bg-panel","--bg-element","--text","--text-mut","--border","--accent","--accent-soft","--accent-text","--ok","--err"];

  function probe(id) {
    const p = document.createElement("span");
    p.setAttribute("theme", id); p.style.display = "none";
    document.body.appendChild(p);
    const cs = getComputedStyle(p);
    const out = {};
    VARS.forEach(v => out[v] = cs.getPropertyValue(v).trim());
    p.remove();
    return out;
  }

  function tile(th) {
    const c = probe(th.id);
    const el = document.createElement("div");
    el.className = "tile";
    el.style.background = c["--bg-base"]; el.style.color = c["--text"];
    el.innerHTML = `
      <div class="t-name" style="background:${c["--bg-panel"]};border-color:${c["--border"]};color:${c["--text-mut"]}">
        <b style="color:${c["--text"]}">${th.name}</b> <span>${th.id}</span>
        <span class="kind">${th.kind}</span>
      </div>
      <div class="t-body">
        <div class="mock">
          <div class="m-user" style="background:${c["--accent-soft"]};color:${c["--text"]}">把登录页改成卡片式布局。</div>
          <div class="m-ev" style="background:${c["--bg-panel"]};border-color:${c["--border"]}">
            <div class="h" style="border-color:${c["--border"]};color:${c["--text-mut"]}"><span style="color:${c["--accent"]}">▸</span> 执行计划 · 3 步 <span style="margin-left:auto;color:${c["--ok"]}">2/3</span></div>
            <div class="b" style="color:${c["--text-mut"]}">✓ 分析现有布局 <span style="color:${c["--text-faint"] || c["--text-mut"]}">· 已完成</span></div>
          </div>
          <div class="m-input" style="background:${c["--bg-panel"]};border-color:${c["--border"]}">
            <span class="ph" style="color:${c["--text-mut"]}">给 DeepSeek 发消息…</span>
            <span class="s" style="background:${c["--accent"]};color:${c["--accent-text"]}">↑</span>
          </div>
        </div>
        <div class="palette">
          ${["--bg-base","--bg-panel","--bg-element","--accent","--ok","--err"].map(v =>
            `<div class="p" style="background:${c[v]}"><span style="color:${th.dark ? "#ffffffcc" : "#000000a0"}">${v.slice(2,8)}</span></div>`).join("")}
        </div>
      </div>`;
    el.onclick = () => {
      document.documentElement.setAttribute("theme", th.id);
      document.querySelectorAll(".tile").forEach(t => t.classList.toggle("on", t === el));
    };
    return el;
  }

  const gl = document.getElementById("gridLight");
  const gd = document.getElementById("gridDark");
  THEMES.forEach(th => (th.dark ? gd : gl).appendChild(tile(th)));
</script>
</body>
</html>
