<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DeepSeek Code v1.4.0 — 主题画廊(6 套)</title>
<link rel="stylesheet" href="tokens.css" />
<style>
  body { padding: 20px; }
  .g-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px; }
  .g-head h1 { font-size: var(--fs-18); font-weight: 600; }
  .g-head .sub { color: var(--text-mut); font-size: var(--fs-12); }
  .g-head .links { margin-left: auto; display: flex; gap: 12px; font-size: var(--fs-12); }
  .g-head .links a { color: var(--accent); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }
  .tile {
    border: 1px solid var(--border-strong); border-radius: var(--r-10);
    overflow: hidden; background: var(--bg-base);
  }
  .tile .t-name {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; font-family: var(--font-ui); font-size: var(--fs-12);
    background: var(--bg-panel); border-bottom: 1px solid var(--border);
    color: var(--text-mut);
  }
  .tile .t-name b { color: var(--text); text-transform: capitalize; }
  .tile .t-name .kind { margin-left: auto; font-size: 10px; }
  .tile .t-body { padding: 12px; }
  .tile .mini-bar { display: flex; gap: 6px; margin-bottom: 10px; }
  .tile .chip { width: 20px; height: 20px; border-radius: 5px; border: 1px solid var(--border); }
  .tile .mock { display: flex; flex-direction: column; gap: 8px; }
  .tile .m-user { background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--r-10); padding: 8px 12px; font-size: var(--fs-13); }
  .tile .m-card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--r-10); overflow: hidden; }
  .tile .m-card .h { display: flex; gap: 6px; align-items: center; padding: 6px 10px; border-bottom: 1px solid var(--border); font-size: var(--fs-12); color: var(--text-mut); }
  .tile .m-card .b { padding: 8px 10px; font-size: var(--fs-12); }
  .tile .m-input { display: flex; align-items: center; gap: 8px; background: var(--bg-panel); border: 1px solid var(--border-strong); border-radius: var(--r-14); padding: 8px 12px; }
  .tile .m-input .ph { flex: 1; color: var(--text-faint); font-size: var(--fs-13); }
  .tile .m-input .s { width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: var(--accent-text); display: grid; place-items: center; font-size: 11px; }
  .tile .palette { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin-top: 10px; }
  .tile .palette .p { height: 22px; border-radius: 4px; border: 1px solid var(--border); position: relative; }
  .tile .palette .p span { position: absolute; bottom: 1px; left: 3px; font-size: 8px; opacity: .7; }
</style>
</head>
<body>
<div class="g-head">
  <h1>主题画廊</h1>
  <span class="sub">v1.4.0 设计系统 · 6 套主题(3 浅 3 深)</span>
  <div class="links">
    <a href="gui.html">← GUI 初稿</a>
    <a href="tui.html">← TUI 初稿</a>
  </div>
</div>
<div class="grid" id="grid"></div>

<script>
  const THEMES = [
    { id: "dawn",    name: "Dawn 晨",    kind: "浅色 · 暖纸",   chips: ["#f7f4ef","#ffffff","#b4582f","#4a7c59","#a8701e","#b03a2e"] },
    { id: "dusk",    name: "Dusk 暮",    kind: "深色 · 暖墨",   chips: ["#1f1c19","#282521","#d97c4a","#6faf82","#d4a04c","#d96a5e"] },
    { id: "grove",   name: "Grove 苔",   kind: "浅色 · 青绿",   chips: ["#f2f5f1","#ffffff","#4a7c59","#a8701e","#b03a2e","#41698c"] },
    { id: "pine",    name: "Pine 松",    kind: "深色 · 墨绿",   chips: ["#161d1a","#1d2622","#6faf82","#d4a04c","#d96a5e","#6b9ec9"] },
    { id: "glacier", name: "Glacier 冰", kind: "浅色 · 冷白",   chips: ["#f5f7fa","#ffffff","#41698c","#4a7c59","#a8701e","#b03a2e"] },
    { id: "ink",     name: "Ink 砚",     kind: "深色 · 冷黑",   chips: ["#13161c","#1a1e26","#6b9ec9","#6faf82","#d4a04c","#d96a5e"] },
  ];

  const grid = document.getElementById("grid");
  const host = document.createElement("div");
  grid.appendChild(host);

  THEMES.forEach(th => {
    const wrap = document.createElement("div");
    wrap.setAttribute("theme", th.id);
    wrap.style.display = "contents";

    // 通过隐藏的 probe 取到该主题的变量值
    const probe = document.createElement("span");
    probe.setAttribute("theme", th.id);
    probe.style.display = "none";
    document.body.appendChild(probe);
    const cs = getComputedStyle(probe);
    const bgBase = cs.getPropertyValue("--bg-base");
    const bgPanel = cs.getPropertyValue("--bg-panel");
    const text = cs.getPropertyValue("--text");
    const textMut = cs.getPropertyValue("--text-mut");
    const border = cs.getPropertyValue("--border");
    const accent = cs.getPropertyValue("--accent");
    probe.remove();

    const tile = document.createElement("div");
    tile.className = "tile";
    tile.style.background = bgBase; tile.style.color = text; tile.style.borderColor = border;
    tile.innerHTML = `
      <div class="t-name" style="background:${bgPanel};border-color:${border}">
        <b>${th.name}</b> <span>${th.id}</span>
        <span class="kind" style="color:${textMut}">${th.kind}</span>
      </div>
      <div class="t-body">
        <div class="mini-bar">${th.chips.map(c => `<span class="chip" style="background:${c}"></span>`).join("")}</div>
        <div class="mock">
          <div class="m-user" style="background:${bgPanel};border-color:${border}">把登录页改成卡片式布局。</div>
          <div class="m-card" style="background:${bgPanel};border-color:${border}">
            <div class="h" style="border-color:${border};color:${textMut}"><span style="color:${accent}">▸</span> 执行计划 · 2 步</div>
            <div class="b">✓ 分析现有布局 <span style="color:${textMut}">· 已完成</span></div>
          </div>
          <div class="m-input" style="background:${bgPanel};border-color:${border}">
            <span class="ph" style="color:${textMut}">给 DeepSeek 发消息…</span>
            <span class="s" style="background:${accent}">↑</span>
          </div>
        </div>
        <div class="palette">
          ${["--bg-base","--bg-panel","--bg-element","--accent","--ok","--err"].map(v => `<div class="p" style="background:var(${v})"><span style="color:var(--text)">${v.slice(2,6)}</span></div>`).join("")}
        </div>
      </div>`;
    grid.appendChild(tile);
  });
</script>
</body>
</html>
