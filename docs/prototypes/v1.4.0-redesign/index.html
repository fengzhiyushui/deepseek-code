<!DOCTYPE html>
<html lang="zh-CN" theme="dawn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DeepSeek Code v1.4.0 — 设计初稿索引</title>
<link rel="stylesheet" href="tokens.css" />
<style>
  body { display: grid; place-items: center; min-height: 100vh; padding: 24px; }
  .wrap { max-width: 720px; width: 100%; }
  h1 { font-size: 22px; font-weight: 600; margin-bottom: 6px; }
  .sub { color: var(--text-mut); margin-bottom: 24px; font-size: var(--fs-13); }
  .cards { display: grid; gap: 12px; }
  a.link {
    display: flex; align-items: center; gap: 14px;
    padding: 16px 18px;
    background: var(--bg-panel); border: 1px solid var(--border);
    border-radius: var(--r-10); color: var(--text); text-decoration: none;
  }
  a.link:hover { border-color: var(--accent); }
  a.link .ico {
    width: 40px; height: 40px; border-radius: var(--r-8); flex: none;
    background: var(--accent-soft); color: var(--accent);
    display: grid; place-items: center; font-size: 18px;
  }
  a.link .tt { font-weight: 600; font-size: var(--fs-14); }
  a.link .dd { color: var(--text-mut); font-size: var(--fs-12); margin-top: 2px; }
  a.link .go { margin-left: auto; color: var(--text-faint); }
  .themes { display: flex; gap: 8px; margin-top: 20px; align-items: center; }
  .themes .lbl { color: var(--text-mut); font-size: var(--fs-12); margin-right: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>DeepSeek Code v1.4.0 · 前端重设计初稿</h1>
  <p class="sub">HTML 展示稿 — 先看方向,定了再实现。点卡片进入;页内右上角圆点可切换主题。</p>

  <div class="cards">
    <a class="link" href="gui.html">
      <span class="ico">🖥</span>
      <span>
        <div class="tt">GUI 主界面</div>
        <div class="dd">侧栏会话 + 对话流 + 事件卡(计划/工具/diff/审批/编排)+ 输入区 + 状态栏</div>
      </span>
      <span class="go">→</span>
    </a>
    <a class="link" href="tui.html">
      <span class="ico">▸_</span>
      <span>
        <div class="tt">TUI 终端界面</div>
        <div class="dd">opencode 式:角色前缀 + 细引导线 + 底部固定输入区,模拟真实终端展示</div>
      </span>
      <span class="go">→</span>
    </a>
    <a class="link" href="gallery.html">
      <span class="ico">◐</span>
      <span>
        <div class="tt">主题画廊</div>
        <div class="dd">6 套主题并排对比:晨/暮/苔/松/冰/砚(3 浅 3 深),微缩界面 + 色板</div>
      </span>
      <span class="go">→</span>
    </a>
  </div>

  <div class="themes">
    <span class="lbl">预览主题:</span>
    <span id="themeBar"></span>
  </div>
</div>

<script>
  const THEMES = [["dawn","晨"],["dusk","暮"],["grove","苔"],["pine","松"],["glacier","冰"],["ink","砚"]];
  const bar = document.getElementById("themeBar");
  const html = document.documentElement;
  THEMES.forEach(([t, name]) => {
    const b = document.createElement("button");
    b.className = "tbtn"; b.textContent = name; b.dataset.t = t;
    b.onclick = () => {
      html.setAttribute("theme", t);
      bar.querySelectorAll(".tbtn").forEach(x => x.classList.toggle("on", x.dataset.t === t));
    };
    bar.appendChild(b);
  });
</script>
</body>
</html>
